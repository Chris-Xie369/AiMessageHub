name: AiMessageHub
options:
  bundleIdPrefix: com.aimessagehub
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AiMessageHub:
    type: application
    platform: iOS
    sources:
      - path: AiMessageHub
        excludes:
          - Info.plist
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimessagehub.app
        INFOPLIST_FILE: AiMessageHub/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: AiMessageHub/AiMessageHub.entitlements
    entitlements:
      path: AiMessageHub/AiMessageHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aimessagehub.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.aimessagehub.app
  AiMessageHubShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AiMessageHubShareExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: AiMessageHub/Models.swift
      - path: AiMessageHub/AppConfig.swift
      - path: AiMessageHub/KeychainStore.swift
      - path: AiMessageHub/AIClient.swift
      - path: AiMessageHub/PromptBuilder.swift
      - path: AiMessageHub/SuggestionProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimessagehub.app.share
        INFOPLIST_FILE: AiMessageHubShareExtension/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: AiMessageHubShareExtension/ShareExtension.entitlements
    entitlements:
      path: AiMessageHubShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aimessagehub.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.aimessagehub.app
  AiMessageHubKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AiMessageHubKeyboardExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: AiMessageHub/Models.swift
      - path: AiMessageHub/AppConfig.swift
      - path: AiMessageHub/KeychainStore.swift
      - path: AiMessageHub/AIClient.swift
      - path: AiMessageHub/PromptBuilder.swift
      - path: AiMessageHub/SuggestionProvider.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimessagehub.app.keyboard
        INFOPLIST_FILE: AiMessageHubKeyboardExtension/Info.plist
        SWIFT_VERSION: "5.9"
        CODE_SIGN_ENTITLEMENTS: AiMessageHubKeyboardExtension/KeyboardExtension.entitlements
    entitlements:
      path: AiMessageHubKeyboardExtension/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aimessagehub.app
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.aimessagehub.app
  AiMessageHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AiMessageHubTests
    dependencies:
      - target: AiMessageHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aimessagehub.app.tests
        SWIFT_VERSION: "5.9"
schemes:
  AiMessageHub:
    build:
      targets:
        AiMessageHub: all
        AiMessageHubShareExtension:
          - build
        AiMessageHubKeyboardExtension:
          - build
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AiMessageHubTests
